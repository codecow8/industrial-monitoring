<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="design_doc_mode" content="prototype" />
    <link rel="icon" href="data:," />
    <title>工业智控平台 · UI 原型</title>
    <style>
      :root {
        --ink-950: #0a1520;
        --ink-900: #0e1d2b;
        --ink-850: #132534;
        --ink-800: #182c3d;
        --slate-700: #34495c;
        --slate-500: #74879a;
        --slate-400: #95a5b4;
        --slate-300: #bac6d0;
        --slate-200: #d8e0e7;
        --slate-150: #e6ebef;
        --slate-100: #f1f4f6;
        --paper: #f8fafb;
        --white: #ffffff;
        --blue: #1684e8;
        --blue-bright: #28a7ff;
        --cyan: #36d9dc;
        --green: #19c993;
        --amber: #eaa73c;
        --danger: #ef6a72;
        --header-h: 68px;
        --status-h: 30px;
        --left-w: 214px;
        --right-w: 352px;
        font-family: -apple-system, "SF Pro Text", "PingFang SC", "Noto Sans SC", sans-serif;
        color: var(--ink-950);
        background: var(--ink-950);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        min-width: 1120px;
      }

      button,
      input {
        font: inherit;
      }

      button {
        border: 0;
      }

      .app {
        width: 100%;
        height: 100%;
        background: var(--paper);
      }

      .topbar {
        height: var(--header-h);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        padding: 0 20px 0 22px;
        color: #f5f9fc;
        background: linear-gradient(90deg, #142739 0%, #0c1a27 68%, #10273a 100%);
        border-bottom: 1px solid rgba(133, 170, 198, 0.22);
      }

      .topbar-left,
      .topbar-actions,
      .brand,
      .save-state,
      .button-content,
      .runtime-status,
      .panel-heading,
      .schema-heading,
      .statusbar,
      .status-group,
      .component-row,
      .canvas-tools,
      .runtime-actions {
        display: flex;
        align-items: center;
      }

      .topbar-left {
        min-width: 0;
        gap: 0;
      }

      .brand {
        gap: 11px;
        padding-right: 22px;
      }

      .brand-mark {
        position: relative;
        width: 25px;
        height: 25px;
        border: 1px solid rgba(91, 218, 226, 0.7);
        background: rgba(30, 111, 148, 0.2);
      }

      .brand-mark::before,
      .brand-mark::after {
        position: absolute;
        content: "";
        background: var(--cyan);
      }

      .brand-mark::before {
        left: 5px;
        bottom: 5px;
        width: 4px;
        height: 8px;
        box-shadow: 6px -4px 0 rgba(54, 217, 220, 0.72), 12px -10px 0 rgba(54, 217, 220, 0.46);
      }

      .brand-mark::after {
        left: -3px;
        top: -3px;
        width: 5px;
        height: 5px;
      }

      .brand-name {
        font-size: 20px;
        font-weight: 680;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }

      .page-name {
        padding-left: 22px;
        font-size: 15px;
        font-weight: 560;
        color: #d7e2ea;
        border-left: 1px solid rgba(192, 211, 225, 0.36);
        white-space: nowrap;
      }

      .save-state {
        gap: 7px;
        margin-left: 24px;
        font-size: 12px;
        color: #9fb3c2;
        white-space: nowrap;
      }

      .published-state {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-left: 14px;
        padding-left: 14px;
        color: #7edfcf;
        font-size: 11px;
        border-left: 1px solid rgba(126, 223, 207, 0.22);
        white-space: nowrap;
      }

      .published-state::before {
        width: 5px;
        height: 5px;
        content: "";
        border-radius: 50%;
        background: #35c9ae;
      }

      .save-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 0 4px rgba(25, 201, 147, 0.12);
      }

      .topbar-actions {
        gap: 10px;
      }

      .btn {
        height: 36px;
        padding: 0 14px;
        border: 1px solid transparent;
        border-radius: 3px;
        cursor: pointer;
        transition: background 150ms ease, border-color 150ms ease, color 150ms ease, transform 150ms ease;
      }

      .btn:active {
        transform: translateY(1px);
      }

      .btn-secondary {
        color: #d9e7f1;
        background: rgba(8, 21, 31, 0.42);
        border-color: #38749f;
      }

      .btn-secondary:hover {
        color: white;
        border-color: #4ba3df;
        background: rgba(25, 77, 108, 0.42);
      }

      .btn-primary {
        color: white;
        background: var(--blue);
        border-color: #2b9bf1;
        box-shadow: 0 5px 16px rgba(0, 104, 194, 0.22);
      }

      .btn-primary:hover {
        background: #2294f2;
      }

      .btn-publish {
        color: #78ead4;
        background: rgba(20, 105, 94, 0.2);
        border-color: #2c8f83;
      }

      .btn-publish:hover {
        color: #a0f5e4;
        background: rgba(28, 130, 116, 0.3);
        border-color: #42b7a8;
      }

      .btn-ghost {
        color: #b8cad6;
        background: transparent;
        border-color: rgba(156, 184, 203, 0.25);
      }

      .btn-ghost:hover {
        color: white;
        border-color: rgba(156, 184, 203, 0.55);
      }

      .button-content {
        justify-content: center;
        gap: 8px;
      }

      .icon {
        display: inline-flex;
        width: 16px;
        height: 16px;
        flex: 0 0 auto;
      }

      .workspace {
        height: calc(100% - var(--header-h));
        display: grid;
        grid-template-columns: var(--left-w) minmax(480px, 1fr) var(--right-w);
        grid-template-rows: minmax(0, 1fr) var(--status-h);
      }

      .left-panel,
      .right-panel {
        min-height: 0;
        color: #172635;
        background: #f7f9fa;
      }

      .left-panel {
        position: relative;
        grid-row: 1;
        border-right: 1px solid #cfd9e0;
      }

      .right-panel {
        grid-column: 3;
        grid-row: 1;
        overflow-y: auto;
        border-left: 1px solid #cfd9e0;
        background: #fafbfc;
      }

      .panel-title {
        height: 50px;
        display: flex;
        align-items: center;
        padding: 0 17px;
        font-size: 14px;
        font-weight: 680;
        border-bottom: 1px solid var(--slate-200);
        background: #ffffff;
      }

      .component-list {
        display: grid;
        gap: 8px;
        padding: 14px 11px;
      }

      .component-row {
        position: relative;
        height: 54px;
        gap: 12px;
        padding: 0 13px;
        text-align: left;
        color: #2c4355;
        background: transparent;
        border: 1px solid transparent;
        border-radius: 4px;
        cursor: pointer;
      }

      .component-row:hover:not(.disabled) {
        background: #edf5fb;
      }

      .component-row.active {
        color: #116ab2;
        background: #e3f2fd;
        border-color: #8fc9f2;
      }

      .component-row.disabled {
        color: #99a7b3;
        background: #f1f3f4;
        cursor: not-allowed;
      }

      .component-row .lock {
        margin-left: auto;
        opacity: 0.68;
      }

      .component-icon {
        width: 24px;
        height: 24px;
      }

      .component-footer {
        position: absolute;
        bottom: 20px;
        left: 18px;
        right: 18px;
        display: flex;
        align-items: center;
        gap: 9px;
        color: #95a4af;
        font-size: 11px;
        text-align: center;
      }

      .component-footer::before,
      .component-footer::after {
        content: "";
        height: 1px;
        flex: 1;
        background: #ccd5dc;
      }

      .canvas-shell {
        position: relative;
        isolation: isolate;
        grid-column: 2;
        grid-row: 1;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        background-color: var(--ink-900);
        background-image:
          linear-gradient(rgba(101, 145, 172, 0.105) 1px, transparent 1px),
          linear-gradient(90deg, rgba(101, 145, 172, 0.105) 1px, transparent 1px),
          linear-gradient(rgba(101, 145, 172, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(101, 145, 172, 0.04) 1px, transparent 1px);
        background-size: 48px 48px, 48px 48px, 12px 12px, 12px 12px;
      }

      .canvas-shell::after {
        position: absolute;
        inset: 0;
        pointer-events: none;
        content: "";
        box-shadow: inset 0 0 90px rgba(0, 0, 0, 0.2);
      }

      .canvas-tools {
        position: absolute;
        z-index: 4;
        top: 12px;
        left: 14px;
        gap: 2px;
        padding: 3px;
        background: rgba(8, 22, 33, 0.88);
        border: 1px solid rgba(109, 151, 179, 0.25);
        border-radius: 4px;
        box-shadow: 0 9px 24px rgba(0, 0, 0, 0.2);
      }

      .tool-button {
        width: 30px;
        height: 28px;
        display: grid;
        place-items: center;
        color: #8da4b6;
        background: transparent;
        border-radius: 2px;
        cursor: pointer;
      }

      .tool-button:hover {
        color: #e8f4fb;
        background: rgba(73, 128, 164, 0.25);
      }

      .tool-button.active {
        color: var(--cyan);
        background: rgba(36, 160, 176, 0.16);
      }

      .metric-selection {
        position: absolute;
        z-index: 2;
        width: 300px;
        min-height: 214px;
        border: 1px solid var(--blue-bright);
        box-shadow: 0 0 0 1px rgba(24, 145, 229, 0.18), 0 18px 48px rgba(0, 0, 0, 0.32);
        user-select: none;
      }

      .metric-selection.dragging {
        cursor: grabbing;
      }

      .component-frame {
        position: absolute;
        z-index: 2;
        border: 1px solid transparent;
        user-select: none;
      }

      .component-frame.selected {
        border-color: var(--blue-bright);
        box-shadow: 0 0 0 1px rgba(24, 145, 229, 0.18), 0 18px 48px rgba(0, 0, 0, 0.32);
      }

      .component-frame.metric-frame {
        width: 300px;
        height: 214px;
      }

      .component-frame.trend-frame {
        width: 720px;
        height: 300px;
      }

      .component-frame.device-frame {
        width: 300px;
        height: 180px;
      }

      .component-frame.alarm-frame {
        width: 520px;
        height: 300px;
      }

      .component-frame.text-frame {
        width: 500px;
        height: 88px;
      }

      .text-block {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        padding: 4px 8px;
        overflow: hidden;
        font-family: -apple-system, "SF Pro Text", "PingFang SC", "Noto Sans SC", sans-serif;
        line-height: 1.35;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .text-block.draggable { cursor: grab; }
      .text-block.draggable:active { cursor: grabbing; }

      .prototype-context-menu {
        position: fixed;
        z-index: 50;
        width: 116px;
        padding: 4px;
        color: #26343f;
        background: rgba(248, 250, 251, 0.98);
        border: 1px solid #c9d2d9;
        border-radius: 7px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.24);
        animation: fade-in 120ms ease-out;
      }

      .prototype-context-menu button {
        width: 100%;
        height: 28px;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 0 8px;
        color: #b33a43;
        font-size: 12px;
        font-weight: 550;
        text-align: left;
        background: transparent;
        border-radius: 2px;
        cursor: pointer;
      }

      .prototype-context-menu button:hover,
      .prototype-context-menu button:focus-visible {
        color: #982b34;
        background: #fbeaec;
        outline: none;
      }

      .canvas-shell {
        overflow: auto;
      }

      .resize-handle {
        position: absolute;
        z-index: 5;
        width: 10px;
        height: 10px;
        background: white;
        border: 2px solid var(--blue-bright);
      }

      .resize-handle.tl { left: -6px; top: -6px; }
      .resize-handle.tr { right: -6px; top: -6px; }
      .resize-handle.bl { left: -6px; bottom: -6px; }
      .resize-handle.br { right: -6px; bottom: -6px; }
      .resize-handle.tm { left: calc(50% - 5px); top: -6px; }
      .resize-handle.bm { left: calc(50% - 5px); bottom: -6px; }

      .resize-handle.tl,
      .resize-handle.br { cursor: nwse-resize; }

      .resize-handle.tr,
      .resize-handle.bl { cursor: nesw-resize; }

      .resize-handle.tm,
      .resize-handle.bm { cursor: ns-resize; }

      .metric-card {
        width: 100%;
        min-height: 212px;
        overflow: hidden;
        color: #f3f8fb;
        background: linear-gradient(145deg, #1a3041 0%, #122332 70%, #10202e 100%);
      }

      .metric-card-header {
        height: 55px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 22px;
        border-bottom: 1px solid rgba(142, 177, 199, 0.18);
        cursor: grab;
      }

      .metric-device {
        font-size: 16px;
        font-weight: 650;
        letter-spacing: 0.015em;
      }

      .metric-menu {
        display: flex;
        gap: 4px;
      }

      .metric-menu span {
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: #9db0be;
      }

      .metric-body {
        padding: 17px 22px 20px;
      }

      .metric-label {
        color: #c6d5df;
        font-size: 14px;
      }

      .metric-value-row {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin-top: 4px;
      }

      .metric-value {
        color: var(--cyan);
        font-family: "DIN Alternate", "Avenir Next Condensed", sans-serif;
        font-size: 54px;
        font-weight: 700;
        line-height: 1.05;
        letter-spacing: 0.01em;
        text-shadow: 0 0 24px rgba(54, 217, 220, 0.14);
      }

      .metric-value.stale {
        color: #8ca1b0;
        text-shadow: none;
      }

      .metric-unit {
        color: #e7eef2;
        font-size: 20px;
        font-weight: 560;
      }

      .metric-state {
        width: fit-content;
        display: flex;
        align-items: center;
        gap: 7px;
        margin-top: 9px;
        padding: 4px 9px;
        color: #51e3b5;
        font-size: 12px;
        font-weight: 610;
        background: rgba(15, 133, 99, 0.22);
        border-radius: 2px;
      }

      .metric-state::before {
        content: "";
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 9px rgba(25, 201, 147, 0.7);
      }

      .metric-state.warning {
        color: #ffd58d;
        background: rgba(155, 101, 23, 0.24);
      }

      .metric-state.warning::before {
        background: var(--amber);
        box-shadow: 0 0 9px rgba(234, 167, 60, 0.66);
      }

      .metric-state.waiting,
      .metric-state.stale {
        color: #9fb1be;
        background: rgba(92, 113, 128, 0.2);
      }

      .metric-state.waiting::before,
      .metric-state.stale::before {
        background: #8094a2;
        box-shadow: none;
      }

      .device-state-card {
        width: 100%;
        height: 100%;
        overflow: hidden;
        color: #f3f8fb;
        background: linear-gradient(145deg, #1a3041 0%, #122332 70%, #10202e 100%);
        border: 1px solid rgba(89, 140, 172, 0.35);
      }

      .device-state-header {
        height: 50px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 18px;
        border-bottom: 1px solid rgba(142, 177, 199, 0.18);
        cursor: grab;
      }

      .device-state-header strong { font-size: 15px; font-weight: 650; }
      .device-state-body { height: calc(100% - 50px); display: flex; align-items: center; gap: 14px; padding: 14px 18px; }
      .device-state-icon { width: 48px; height: 48px; display: grid; place-items: center; flex: none; color: #51e3b5; background: rgba(15, 133, 99, 0.2); border: 1px solid rgba(81, 227, 181, 0.28); border-radius: 50%; }
      .device-state-copy { min-width: 0; display: grid; gap: 3px; }
      .device-state-label { color: #8fa7b7; font-size: 10px; letter-spacing: 0.06em; }
      .device-state-name { color: #51e3b5; font-size: 22px; font-weight: 680; line-height: 1.15; }
      .device-state-description { color: #b6c6d0; font-size: 11px; }
      .device-state-updated { color: #718a9b; font-size: 9px; }
      .device-state-card.stopped .device-state-icon { color: #9caeba; background: rgba(116, 135, 150, 0.16); border-color: rgba(156, 174, 186, 0.24); }
      .device-state-card.stopped .device-state-name { color: #a9bac5; }
      .device-state-card.fault .device-state-icon { color: #ff9aa2; background: rgba(177, 48, 57, 0.2); border-color: rgba(239, 106, 114, 0.32); }
      .device-state-card.fault .device-state-name { color: #ff9aa2; }
      .device-state-card.maintenance .device-state-icon { color: #efbd68; background: rgba(155, 101, 23, 0.22); border-color: rgba(234, 167, 60, 0.3); }
      .device-state-card.maintenance .device-state-name { color: #efbd68; }
      .device-state-card.unknown .device-state-icon,
      .device-state-card.waiting .device-state-icon,
      .device-state-card.stale .device-state-icon { color: #91a5b3; background: rgba(105, 125, 139, 0.15); border-color: rgba(145, 165, 179, 0.22); }
      .device-state-card.unknown .device-state-name,
      .device-state-card.waiting .device-state-name,
      .device-state-card.stale .device-state-name { color: #9fb1be; }
      .device-state-card.stale .device-state-body { opacity: 0.58; }

      .alarm-list-card {
        width: 100%;
        height: 100%;
        overflow: hidden;
        color: #eaf2f7;
        background: linear-gradient(145deg, #172d3e 0%, #102332 72%, #0e202d 100%);
        border: 1px solid rgba(89, 140, 172, 0.35);
      }

      .alarm-list-header {
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 0 18px;
        border-bottom: 1px solid rgba(142, 177, 199, 0.16);
        cursor: grab;
      }

      .alarm-list-heading { display: flex; align-items: center; gap: 9px; min-width: 0; }
      .alarm-list-heading strong { overflow: hidden; font-size: 15px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
      .alarm-list-actions { display: flex; align-items: center; gap: 8px; }
      .alarm-history-button { min-height: 25px; display: inline-flex; align-items: center; gap: 5px; padding: 3px 7px; color: #a8cbd9; font-size: 10px; background: rgba(48, 111, 142, 0.17); border: 1px solid rgba(100, 162, 191, 0.29); border-radius: 2px; cursor: pointer; white-space: nowrap; }
      .alarm-history-button:hover, .alarm-history-button:focus-visible { color: #e0f6fb; background: rgba(48, 111, 142, 0.31); border-color: rgba(100, 162, 191, 0.56); outline: none; }
      .alarm-example-badge { padding: 2px 6px; color: #8db8d2; font-size: 9px; background: rgba(50, 116, 153, 0.2); border: 1px solid rgba(102, 164, 198, 0.28); border-radius: 2px; white-space: nowrap; }
      .alarm-count { padding: 3px 7px; color: #8ca1b0; font-size: 10px; background: rgba(95, 119, 136, 0.14); border: 1px solid rgba(121, 151, 171, 0.18); border-radius: 2px; white-space: nowrap; }
      .alarm-count.active { color: #f1c982; background: rgba(155, 101, 23, 0.2); border-color: rgba(234, 167, 60, 0.26); }
      .alarm-list-body { height: calc(100% - 52px); overflow-y: auto; }
      .alarm-rows { padding: 8px; }

      .alarm-row {
        min-height: 92px;
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr) auto;
        align-items: center;
        gap: 11px;
        padding: 12px 12px 11px;
        border-bottom: 1px solid rgba(137, 168, 188, 0.13);
      }

      .alarm-row:last-child { border-bottom: 0; }
      .alarm-kind-icon { width: 32px; height: 32px; display: grid; place-items: center; color: #efbd68; background: rgba(155, 101, 23, 0.2); border: 1px solid rgba(234, 167, 60, 0.26); border-radius: 50%; }
      .alarm-row.fault .alarm-kind-icon { color: #ff9aa2; background: rgba(177, 48, 57, 0.2); border-color: rgba(239, 106, 114, 0.3); }
      .alarm-row-copy { min-width: 0; display: grid; gap: 4px; }
      .alarm-row-copy strong { overflow: hidden; color: #e8f0f5; font-size: 12px; font-weight: 640; text-overflow: ellipsis; white-space: nowrap; }
      .alarm-row-copy span { overflow: hidden; color: #9eb1be; font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
      .alarm-row-copy small { color: #708a9b; font-size: 9px; }
      .alarm-row-value { display: grid; justify-items: end; gap: 7px; padding-left: 8px; }
      .alarm-row-value strong { color: #efbd68; font-family: "DIN Alternate", "Avenir Next Condensed", sans-serif; font-size: 14px; white-space: nowrap; }
      .alarm-row.fault .alarm-row-value strong { color: #ff9aa2; }
      .alarm-row-value span { padding: 2px 6px; font-size: 9px; border-radius: 2px; white-space: nowrap; }
      .alarm-row-value span.fresh { color: #60dcb5; background: rgba(15, 133, 99, 0.17); }
      .alarm-row-value span.stale { color: #d8ae68; background: rgba(133, 91, 28, 0.2); }

      .decision-block {

      .runtime {

        color: #87a0b2;

        gap: 16px;

      .runtime-status {
        gap: 7px;

        font-size: 11px;

      .runtime-status::before {
        width: 7px;
        height: 7px;
        content: "";

        background: #19c993;
        box-shadow: 0 0 9px rgba(25, 201, 147, 0.55);

      .runtime-status.connecting::before {
        background: #28a7ff;
        box-shadow: 0 0 9px rgba(40, 167, 255, 0.55);

      .runtime-status.stale::before {
        background: #eaa73c;
        box-shadow: 0 0 9px rgba(234, 167, 60, 0.55);
      }

      .runtime-status.disconnected::before {
        background: #ef6a72;
        box-shadow: 0 0 9px rgba(239, 106, 114, 0.55);
      }

      .runtime-canvas {
        position: relative;
        height: calc(100% - 64px);
        overflow: hidden;
        background-color: #0c1b27;
        background-image:

          linear-gradient(90deg, rgba(90, 133, 158, 0.07) 1px, transparent 1px);

        font-size: 11px;
        letter-spacing: 0.08em;

      .runtime-note {
        position: absolute;
        right: 26px;
        bottom: 24px;
        max-width: 260px;
        padding: 12px 14px;
        color: #7892a4;
        font-size: 11px;
        line-height: 1.7;
        background: rgba(11, 29, 42, 0.72);
        border-left: 2px solid #2d759d;
      }

      .prototype-controls {
        position: absolute;
        z-index: 4;
        left: 26px;
        bottom: 24px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px;
        background: rgba(8, 23, 34, 0.9);
        border: 1px solid rgba(92, 137, 164, 0.35);

      }

      .runtime-empty strong {
        color: #dce8ef;

      }

      .runtime-empty span {

        font-size: 12px;
        line-height: 1.7;

      /* 使用帮助：沿用浅色属性面板，非模态侧栏保留左侧编辑操作。 */
      .help-panel { position: fixed; z-index: 60; top: var(--header-h); right: 0; bottom: var(--status-h); width: 416px; max-width: 44vw; display: flex; flex-direction: column; background: var(--white); border-left: 1px solid var(--slate-200); box-shadow: -10px 0 30px rgba(10, 21, 32, .13); animation: slide-in 160ms ease; }

      .help-history-result .help-alarm-device { margin-top: 4px; font-size: 10px; color: var(--slate-500); overflow-wrap: anywhere; }
      .help-alarm-times { display: flex; gap: 16px; margin-top: 8px; font-size: 10px; color: var(--slate-500); }
      .help-alarm-times strong { color: var(--slate-700); font-weight: 500; font-variant-numeric: tabular-nums; }
      .help-alarm-record summary { display: flex; align-items: center; gap: 5px; margin-top: 9px; color: var(--blue); font-size: 10px; cursor: pointer; list-style: none; }

      .help-panel button:focus-visible, .help-panel summary:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

      @keyframes fade-in {
