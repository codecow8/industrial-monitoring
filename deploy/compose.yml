name: industrial-monitoring

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX}-postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: industrial_monitoring
      POSTGRES_USER: industrial
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U industrial -d industrial_monitoring"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  api:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX}-api:${RELEASE_SHA:?Set RELEASE_SHA}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://industrial:${POSTGRES_PASSWORD}@postgres:5432/industrial_monitoring
      AI_PROVIDER: ${AI_PROVIDER:-deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *logging

  simulator:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX}-simulator:${RELEASE_SHA:?Set RELEASE_SHA}
    restart: unless-stopped
    environment:
      TELEMETRY_API_URL: http://api:8000/api/telemetry
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

  web:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX}-web:${RELEASE_SHA:?Set RELEASE_SHA}
    restart: unless-stopped
    environment:
      DEMO_USERNAME: ${DEMO_USERNAME:?Set DEMO_USERNAME}
      DEMO_PASSWORD_HASH: ${DEMO_PASSWORD_HASH:?Set DEMO_PASSWORD_HASH}
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1/healthz]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

volumes:
  postgres_data:
