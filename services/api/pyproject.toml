[project]
name = "industrial-api"
version = "0.1.0"
description = "Backend API for the industrial monitoring platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.20.0",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "psycopg[binary]==3.3.5",
  "sqlalchemy==2.0.52",
  "uvicorn==0.52.4",
  "websockets==15.0.1",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: exercises the public HTTP interface against PostgreSQL",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/industrial_api"]
