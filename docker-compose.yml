services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: industrial_monitoring
      POSTGRES_USER: industrial
      POSTGRES_PASSWORD: industrial_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U industrial -d industrial_monitoring"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - industrial_postgres_data:/var/lib/postgresql

volumes:
  industrial_postgres_data:
